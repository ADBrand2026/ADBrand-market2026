/* =========================
   SECURE ADMIN LOGIN (Supabase Auth)
========================= */
async function adminLogin(){
  const email = prompt("Admin Email डालें:");
  if(!email){ return; }
  const password = prompt("Admin Password डालें:");
  if(!password){ return; }
  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email.trim(),
      password: password
    });
    if(error){
      alert("Admin Login Failed: " + error.message);
      return;
    }
    if(!data.user){
      alert("Login failed.");
      return;
    }
    const { data: profile, error: profileError } = await supabaseClient
      .from("profiles")
      .select("id,user_id,role,full_name,is_active")
      .eq("user_id", data.user.id)
      .maybeSingle();

    if(profileError || !profile || profile.role !== "admin" || profile.is_active !== true){
      await supabaseClient.auth.signOut();
      alert("Access denied. Admin account required.");
      return;
    }
    alert("Secure Admin Login Successful");
    openPanel("admin");
    renderAdmin();
  }catch(error){
    console.error("Admin Login Error:", error);
    alert("Admin login में technical error आया।");
  }
}

/* =========================
   SECURITY AGAINST HTML
========================= */
function safe(value){
 return String(value ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

/* =========================
