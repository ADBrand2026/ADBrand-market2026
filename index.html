<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>AD Brand Market</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

header{
background:#111;color:#fff;padding:12px 16px;
display:flex;justify-content:space-between;align-items:center;
gap:10px;position:sticky;top:0;z-index:5
}

.logo{font-size:22px;font-weight:800}
.head{display:flex;gap:7px;flex-wrap:wrap}
.head button,.head select{padding:8px;border-radius:8px;border:0}

.hero{
background:linear-gradient(135deg,#111,#444);
color:#fff;text-align:center;padding:38px 15px;
}

.hero h1{margin:0 0 8px;font-size:32px}
.hero p{margin:0}

main{max-width:1150px;margin:auto;padding:18px}

.search{
width:100%;padding:13px;border:1px solid #ccc;
border-radius:10px;margin-bottom:16px
}

.title{margin:24px 0 12px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
gap:14px
}

.cat,.card,.panel,.offer{
background:#fff;border-radius:13px;
box-shadow:0 2px 9px #0001
}

.cat{padding:16px;text-align:center;font-weight:700}
.card{padding:13px}

.pic{
height:125px;background:#eee;border-radius:10px;
display:flex;align-items:center;justify-content:center;
font-size:55px
}

.price{font-size:20px;font-weight:700;margin:7px 0}

.badge{
display:inline-block;background:#ffe000;
padding:4px 7px;border-radius:6px;
font-size:12px;margin:7px 0
}

.btn{
width:100%;padding:11px;border-radius:8px;
background:#111;color:#fff;margin-top:7px
}

.green{background:#16883b}
.red{background:#c62828}
.orange{background:#df7600}
.light{background:#eee;color:#111}

.panel{
padding:18px;margin-top:18px
}

.offers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:12px
}

.offer{
padding:16px;border-left:5px solid #111
}

.item{
display:flex;justify-content:space-between;
gap:8px;padding:10px 0;
border-bottom:1px solid #ddd
}

.qty button{
width:29px;height:29px;
border-radius:50%;background:#111;color:#fff
}

.total{
font-size:20px;font-weight:700;margin-top:12px
}

.form{margin:10px 0}
.form label{
display:block;font-weight:700;margin-bottom:5px
}

.form input,.form select,.form textarea{
width:100%;padding:11px;
border:1px solid #ccc;border-radius:8px
}

.notice,.ok,.bad{
padding:12px;border-radius:9px;margin:8px 0
}

.notice{background:#fff5c7}
.ok{background:#dcfce3}
.bad{background:#ffe0e0}

.step{
padding:10px;background:#eee;
border-radius:8px;margin:6px 0
}

.done{background:#dcfce3}

.phone{
color:#075bd5;font-weight:700
}

.modal{
position:fixed;inset:0;background:#0008;
display:flex;align-items:center;
justify-content:center;padding:12px;z-index:20
}

.box{
background:#fff;width:100%;max-width:520px;
max-height:92vh;overflow:auto;
border-radius:14px;padding:20px
}

.close{
float:right;width:32px;height:32px;
border-radius:50%;background:#eee
}

.hide{display:none!important}

footer{
background:#111;color:#fff;text-align:center;
padding:28px;margin-top:30px
}

#intro{
position:fixed;inset:0;background:#111;color:#fff;
z-index:100;display:flex;
align-items:center;justify-content:center;
