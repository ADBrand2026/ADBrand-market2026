<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AD Brand Market</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f4f7fb;
 color:#172033;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{
 padding:18px;
 color:white;
 text-align:center;
 font-size:25px;
 font-weight:800;
 box-shadow:0 3px 15px #0002;
}
.customerTop{background:linear-gradient(135deg,#ff4b8b,#7b2cff)}
.sellerTop{background:linear-gradient(135deg,#087f23,#39b54a)}
.deliveryTop{background:linear-gradient(135deg,#0066cc,#00a6ff)}
.adminTop{background:linear-gradient(135deg,#111827,#7c3aed)}

.container{max-width:1200px;margin:auto;padding:16px}

.hero{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at 20% 20%,#ff4b8b55,transparent 30%),
 radial-gradient(circle at 80% 30%,#7b2cff55,transparent 30%),
 linear-gradient(135deg,#111827,#35125f);
}
.heroBox{
 width:100%;
 max-width:850px;
 padding:35px 20px;
 border-radius:30px;
 color:white;
 text-align:center;
 background:#ffffff12;
 backdrop-filter:blur(15px);
 border:1px solid #ffffff30;
 box-shadow:0 20px 70px #0007;
}
.logo{
 font-size:45px;
 font-weight:900;
 letter-spacing:2px;
 margin-bottom:10px;
}
.subtitle{opacity:.9;margin-bottom:25px}

.roles{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:14px;
}
.role{
 border:0;
 border-radius:20px;
 padding:25px 10px;
 color:white;
 font-weight:800;
 font-size:18px;
 transition:.2s;
}
.role:hover{transform:translateY(-4px)}
.rCustomer{background:linear-gradient(135deg,#ff4b8b,#ff7b54)}
.rSeller{background:linear-gradient(135deg,#087f23,#54c85a)}
.rDelivery{background:linear-gradient(135deg,#0066cc,#00b7ff)}
.rAdmin{background:linear-gradient(135deg,#111827,#7c3aed)}

.nav{
 display:flex;
 gap:8px;
 overflow:auto;
 padding:10px;
 background:white;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 2px 10px #0001;
}
.nav button{
 border:0;
 padding:11px 14px;
 border-radius:12px;
 white-space:nowrap;
 background:#eef2f7;
 font-weight:700;
}
.nav button:hover{background:#ddd}

.card{
 background:white;
 border-radius:18px;
 padding:18px;
 margin:14px 0;
 box-shadow:0 5px 22px #0000000d;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:15px;
}
.formGrid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px;
}
label{font-weight:700;font-size:14px}
input,select,textarea{
 width:100%;
 margin-top:6px;
 padding:11px;
 border:1px solid #d5dce8;
 border-radius:10px;
 background:white;
}
textarea{min-height:90px;resize:vertical}

.primary{
 border:0;
 color:white;
 padding:11px 16px;
 border-radius:11px;
 font-weight:800;
 background:#2563eb;
}
.green{background:#159447}
.red{background:#dc2626}
.orange{background:#ea7b00}
.gray{background:#64748b}
