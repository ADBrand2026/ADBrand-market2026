<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AD Brand Market</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      margin-top: 6px;
      font-size: 15px;
    }

    .search {
      padding: 18px 15px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .container {
      padding: 20px 15px;
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      margin-bottom: 15px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .category {
      background: white;
      padding: 20px 10px;
      border-radius: 12px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .shops {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .shop {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .shop h3 {
      margin-bottom: 8px;
    }

    .shop p {
      color: #666;
      margin-bottom: 12px;
    }

    .btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
    }

    footer {
      margin-top: 30px;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (min-width: 700px) {
      .categories {
        grid-template-columns: repeat(4, 1fr);
      }

      .shops {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>AD Brand Market</h1>
    <p>आपका अपना Local Marketplace</p>
  </header>

  <div class="search">
    <input type="text" placeholder="सामान या दुकान खोजें...">
  </div>

  <div class="container">

    <h2>Categories</h2>

    <div class="categories">
      <div class="category">👕 कपड़े</div>
      <div class="category">👟 चप्पल और जूते</div>
      <div class="category">🍔 खाना</div>
      <div class="category">☕ चाय और Snacks</div>
    </div>

    <h2>Nearby Shops</h2>

    <div class="shops">

      <div class="shop">
        <h3>Local Fashion Store</h3>
        <p>कपड़े और फैशन आइटम</p>
        <a href="#" class="btn">देखें</a>
      </div>

      <div class="shop">
        <h3>AD Food Corner</h3>
        <p>Rolls, Momos और Snacks</p>
        <a href="#" class="btn">देखें</a>
      </div>

      <div class="shop">
        <h3>Local Footwear</h3>
        <p>चप्पल और जूते</p>
        <a href="#" class="btn">देखें</a>
      </div>

    </div>

  </div>

  <footer>
    <p>© 2026 AD Brand Market</p>
  </footer>

</body>
</html>
