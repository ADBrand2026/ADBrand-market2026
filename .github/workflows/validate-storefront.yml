name: Validate storefront HTML and JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.external = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.current = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.current))
                      self.in_script = False
                      self.external = False
                      self.current = []

          source = Path("index.html").read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(source)
          parser.close()
          if not parser.scripts:
              raise SystemExit("FAIL: no inline scripts found")
          out = Path("/tmp/adbrand-inline-scripts")
          out.mkdir(exist_ok=True)
          for index, script in enumerate(parser.scripts, 1):
              (out / f"script-{index}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} inline JavaScript blocks.")
          PY
          for file in /tmp/adbrand-inline-scripts/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          echo "All inline JavaScript blocks passed syntax checks."
