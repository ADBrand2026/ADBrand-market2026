name: Validate AD Brand Market HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract and syntax-check inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.active = False
                  self.external = False
                  self.kind = ""
                  self.chunks = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = {k.lower(): (v or "") for k, v in attrs}
                      self.active = True
                      self.external = bool(attrs.get("src"))
                      self.kind = attrs.get("type", "").lower()
                      self.chunks = []

              def handle_data(self, data):
                  if self.active and not self.external:
                      self.chunks.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      if not self.external and self.kind not in ("application/json", "application/ld+json"):
                          self.scripts.append("".join(self.chunks))
                      self.active = False
                      self.external = False
                      self.kind = ""
                      self.chunks = []

          files = [Path("index.html"), Path("private-admin.html")]
          count = 0
          for path in files:
              if not path.is_file():
                  raise SystemExit(f"Missing expected file: {path}")
              parser = ScriptExtractor()
              parser.feed(path.read_text(encoding="utf-8"))
              for index, script in enumerate(parser.scripts, 1):
                  if not script.strip():
                      continue
                  out = Path("/tmp") / f"{path.stem}-inline-{index}.js"
                  out.write_text(script, encoding="utf-8")
                  count += 1
          print(f"Extracted {count} inline JavaScript blocks.")
          PY
          for js in /tmp/index-inline-*.js /tmp/private-admin-inline-*.js; do
            [ -f "$js" ] || continue
            echo "Checking $js"
            node --check "$js"
          done
      - name: Check private Admin remains absent from the storefront navigation
        shell: bash
        run: |
          python3 -c 'import re,pathlib; h=pathlib.Path("index.html").read_text(encoding="utf-8"); m=re.search(r"href\s*=\s*[\x22\x27][^\x22\x27]*private-admin\.html",h,re.I); print("No storefront Admin link found." if not m else "Storefront Admin link found."); raise SystemExit(1 if m else 0)'
