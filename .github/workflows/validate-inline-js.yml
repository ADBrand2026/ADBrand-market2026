name: Validate inline JavaScript
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline scripts and check JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      if not self.external and "".join(self.parts).strip():
                          self.scripts.append("".join(self.parts))
                      self.active = False
                      self.external = False
          parser = ScriptParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript found")
          out = Path("/tmp/adbrand-inline-js")
          out.mkdir(exist_ok=True)
          for i, src in enumerate(parser.scripts):
              (out / f"script-{i}.js").write_text(src, encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} inline scripts.")
          PY
          for f in /tmp/adbrand-inline-js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
