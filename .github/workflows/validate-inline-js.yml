name: Validate inline JavaScript
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline scripts from both pages and check JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []

              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      source = "".join(self.parts).strip()
                      if not self.external and source:
                          self.scripts.append(source)
                      self.active = False
                      self.external = False

          out = Path("/tmp/adbrand-inline-js")
          out.mkdir(exist_ok=True)
          count = 0
          for html_path in (Path("index.html"),):
              parser = ScriptParser()
              parser.feed(html_path.read_text(encoding="utf-8"))
              if not parser.scripts:
                  raise SystemExit(f"No inline JavaScript found in {html_path}")
              for i, source in enumerate(parser.scripts):
                  name = html_path.stem + f"-script-{i}.js"
                  (out / name).write_text(source, encoding="utf-8")
                  count += 1
              print(f"{html_path}: extracted {len(parser.scripts)} inline scripts.")
          print(f"Total inline scripts: {count}")
          PY
          for f in /tmp/adbrand-inline-js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
